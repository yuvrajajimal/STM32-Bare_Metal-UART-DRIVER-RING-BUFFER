<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How the UART driver works</title>
  <desc>A byte typed in PuTTY travels through the ST-LINK to USART2, the interrupt handler stores it in the ring buffer, the main loop reads it and echoes it back out through the transmitter.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 z" fill="#444441"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M9 1 L1 5 L9 9 z" fill="#444441"/>
    </marker>
  </defs>
  <rect width="900" height="510" rx="12" fill="#ffffff"/>

  <!-- Hardware row -->
  <rect x="40" y="40" width="170" height="76" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="125" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">1 · PuTTY on the PC</text>
  <text x="125" y="94" text-anchor="middle" font-size="13" fill="#2c2c2a">you press L</text>

  <rect x="250" y="40" width="200" height="76" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="350" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">ST-LINK (on the Nucleo)</text>
  <text x="350" y="94" text-anchor="middle" font-size="13" fill="#2c2c2a">USB virtual COM port</text>

  <rect x="490" y="40" width="150" height="76" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="565" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">Pins PA3 / PA2</text>
  <text x="565" y="94" text-anchor="middle" font-size="13" fill="#2c2c2a">RX in, TX out</text>

  <rect x="680" y="40" width="180" height="76" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="770" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">2 · USART2</text>
  <text x="770" y="85" text-anchor="middle" font-size="13" fill="#2c2c2a">shifts the byte into DR</text>
  <text x="770" y="103" text-anchor="middle" font-size="13" fill="#2c2c2a">and sets the RXNE flag</text>

  <line x1="212" y1="78" x2="248" y2="78" stroke="#444441" stroke-width="2" marker-start="url(#b)" marker-end="url(#a)"/>
  <line x1="452" y1="78" x2="488" y2="78" stroke="#444441" stroke-width="2" marker-start="url(#b)" marker-end="url(#a)"/>
  <line x1="642" y1="78" x2="678" y2="78" stroke="#444441" stroke-width="2" marker-start="url(#b)" marker-end="url(#a)"/>

  <!-- Down arrow: USART2 to handler -->
  <line x1="770" y1="118" x2="770" y2="198" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>
  <text x="758" y="152" text-anchor="end" font-size="12" font-style="italic" fill="#5f5e5a">RXNE set and RXNEIE on:</text>
  <text x="758" y="168" text-anchor="end" font-size="12" font-style="italic" fill="#5f5e5a">the NVIC calls the handler</text>

  <!-- Middle row -->
  <rect x="620" y="200" width="250" height="112" rx="8" fill="#faece7" stroke="#d85a30" stroke-width="1.5"/>
  <text x="745" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#712b13">3 · USART2_IRQHandler</text>
  <text x="745" y="250" text-anchor="middle" font-size="13" fill="#712b13">reads DR once, clearing RXNE</text>
  <text x="745" y="270" text-anchor="middle" font-size="13" fill="#712b13">stores the byte at rx_head</text>
  <text x="745" y="290" text-anchor="middle" font-size="13" fill="#712b13">then moves rx_head forward</text>

  <rect x="335" y="200" width="250" height="112" rx="8" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1.5"/>
  <text x="460" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342c">4 · Ring buffer rx_buf[128]</text>
  <text x="460" y="250" text-anchor="middle" font-size="13" fill="#04342c">127 usable (one slot stays empty)</text>
  <text x="460" y="270" text-anchor="middle" font-size="13" fill="#04342c">head: moved by the handler</text>
  <text x="460" y="290" text-anchor="middle" font-size="13" fill="#04342c">tail: moved by the main loop</text>

  <rect x="50" y="200" width="250" height="112" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1.5"/>
  <text x="175" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215c">5 · Main loop (main.c)</text>
  <text x="175" y="250" text-anchor="middle" font-size="13" fill="#26215c">UART2_ReadByte moves rx_tail</text>
  <text x="175" y="270" text-anchor="middle" font-size="13" fill="#26215c">line editor: echo, backspace</text>
  <text x="175" y="290" text-anchor="middle" font-size="13" fill="#26215c">Enter runs the command</text>

  <line x1="618" y1="256" x2="587" y2="256" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>
  <line x1="333" y1="256" x2="302" y2="256" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>

  <!-- Down arrow: main to send -->
  <line x1="175" y1="314" x2="175" y2="372" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>

  <!-- Bottom row -->
  <rect x="50" y="374" width="250" height="70" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1.5"/>
  <text x="175" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215c">6 · UART2_SendChar</text>
  <text x="175" y="422" text-anchor="middle" font-size="13" fill="#26215c">waits for TXE, then writes DR</text>

  <rect x="620" y="374" width="250" height="70" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1.5"/>
  <text x="745" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c2c2a">7 · USART2 transmitter</text>
  <text x="745" y="418" text-anchor="middle" font-size="13" fill="#2c2c2a">sends it out on PA2 to PuTTY</text>
  <text x="745" y="434" text-anchor="middle" font-size="13" fill="#2c2c2a">the character shows on screen</text>

  <line x1="302" y1="409" x2="618" y2="409" stroke="#444441" stroke-width="2" marker-end="url(#a)"/>
  <text x="460" y="399" text-anchor="middle" font-size="12" font-style="italic" fill="#5f5e5a">echo and replies (blocking send)</text>

  <!-- Legend -->
  <rect x="50" y="472" width="14" height="14" rx="3" fill="#f1efe8" stroke="#888780"/>
  <text x="70" y="484" font-size="12" fill="#2c2c2a">Hardware</text>
  <rect x="170" y="472" width="14" height="14" rx="3" fill="#faece7" stroke="#d85a30"/>
  <text x="190" y="484" font-size="12" fill="#2c2c2a">Runs on the interrupt</text>
  <rect x="390" y="472" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#1d9e75"/>
  <text x="410" y="484" font-size="12" fill="#2c2c2a">Shared ring buffer</text>
  <rect x="590" y="472" width="14" height="14" rx="3" fill="#eeedfe" stroke="#7f77dd"/>
  <text x="610" y="484" font-size="12" fill="#2c2c2a">Runs in the main loop</text>
</svg>
